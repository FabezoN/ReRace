name: CI/CD Backend NestJS

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  REGION:       europe-west1
  REPO_NAME:    rerace-repo
  SERVICE_NAME: rerace-api

jobs:

  test:
    name: Tests Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installation des dependances
        run: npm ci

      - name: Generation du client Prisma
        run: npx prisma generate

      - name: Lancement des tests
        run: npm run test

  deploy:
    name: Build et Deploy sur GCP
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurer Docker pour Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build et Push de l'image Docker
        working-directory: ./server
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: Deploiement sur Cloud Run
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image          $IMAGE_TAG \
            --region         ${{ env.REGION }} \
            --platform       managed \
            --allow-unauthenticated \
            --port           3000 \
            --set-env-vars   "\
          DATABASE_URL=${{ secrets.DATABASE_URL }},\
          SUPABASE_URL=${{ secrets.SUPABASE_URL }},\
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }},\
          SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }},\
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }},\
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }},\
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}"

      - name: URL du service deploye
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format "value(status.url)"
